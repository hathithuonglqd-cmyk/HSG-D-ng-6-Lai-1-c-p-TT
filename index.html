<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Bài Tập Sinh Học 🧬</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF9A9E;
            --secondary: #FECFEF;
            --accent: #A8E6CF;
            --text: #4A4A4A;
            --bg: #FDFBFB;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--secondary) 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        h1, h2 {
            font-family: 'Baloo 2', cursive;
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-weight: 600;
            color: #888;
            margin-bottom: 30px;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Intro Screen */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary);
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--secondary);
            border-radius: 15px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--secondary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Baloo 2', cursive;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 154, 158, 0.6);
        }

        /* Quiz Screen */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--secondary);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .timer {
            font-size: 20px;
            color: #d63031;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .question-card {
            background: #fffafa;
            border: 2px dashed var(--secondary);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .option {
            background: white;
            border: 2px solid #eee;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .option:hover { border-color: var(--primary); }
        .option.selected {
            background: var(--secondary);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Results & Explanations */
        .option.correct-ans {
            background: var(--accent) !important;
            border-color: #2ecc71 !important;
            color: #27ae60 !important;
        }
        .option.wrong-ans {
            background: #ff7675 !important;
            border-color: #d63031 !important;
            color: white !important;
        }
        
        .explanation {
            margin-top: 15px;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
            font-size: 14.5px;
            line-height: 1.6;
            display: none;
            border-left: 5px solid var(--accent);
        }
        .explanation h4 { margin: 0 0 10px 0; color: #2f3640; }

        .score-board {
            text-align: center;
            background: var(--accent);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            color: #1e6d50;
        }
        .score-board h1 { color: #1e6d50; font-size: 40px; margin: 10px 0; }
        
        /* Loading overlay */
        #loading {
            display: none; text-align: center; font-weight: bold; color: var(--primary); margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH NHẬP THÔNG TIN -->
    <div id="intro-screen" class="screen active">
        <h1>🌸 PHIẾU BÀI TẬP 🌸</h1>
        <div class="subtitle">Chủ đề: DẠNG 6. Tự thụ phấn & Giao phấn ngẫu nhiên</div>
        
        <div class="input-group">
            <label>👤 Tên của bạn là gì nhỉ?</label>
            <input type="text" id="studentName" placeholder="Ví dụ: Nguyễn Văn A" required>
        </div>
        <div class="input-group">
            <label>🏫 Lớp mấy nè?</label>
            <input type="text" id="studentClass" placeholder="Ví dụ: 12A1" required>
        </div>
        
        <button class="btn" onclick="startQuiz()">Bắt đầu làm bài 🚀</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="screen">
        <div class="header-bar">
            <div>👩‍🎓 <span id="displayInfo"></span></div>
            <div class="timer">⏱️ <span id="timeDisplay">00:00</span></div>
        </div>

        <div id="quiz-container">
            <!-- Câu hỏi sẽ được render ở đây -->
        </div>

        <button class="btn" id="submitBtn" onclick="submitQuiz()">Nộp bài & Xem điểm ✨</button>
        <div id="loading">Đang gửi kết quả về hệ thống... ⏳</div>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="result-screen" class="screen">
        <div class="score-board">
            <h2>Hoàn thành xuất sắc! 🎉</h2>
            <div>Điểm của bạn:</div>
            <h1 id="scoreDisplay">10/10</h1>
            <div>Thời gian hoàn thành: <strong id="resultTime">00:00</strong></div>
        </div>
        
        <h3 style="text-align: center; color: var(--primary);">📝 CHI TIẾT ĐÁP ÁN & LỜI GIẢI 📝</h3>
        <div id="review-container">
            <!-- Review câu hỏi và giải thích ở đây -->
        </div>
    </div>
</div>

<script>
    // Dữ liệu câu hỏi lấy từ yêu cầu của bạn
    const questions = [
        {
            q: "<b>Bài 1:</b> Ở thực vật, gen A (hoa đỏ) trội hoàn toàn so với gen a (hoa trắng). Lai hoa đỏ x hoa trắng thu được F1: 1 đỏ : 1 trắng. Cho F1 giao phấn ngẫu nhiên được F2. <br><br><b>Hỏi:</b> Nếu cho các cây ở F2 tự thụ phấn bắt buộc thì kết quả phân li kiểu hình ở F3 sẽ như thế nào?",
            options: [
                "11 cây hoa đỏ : 21 cây hoa trắng",
                "7 cây hoa đỏ : 9 cây hoa trắng",
                "9 cây hoa đỏ : 7 cây hoa trắng",
                "3 cây hoa đỏ : 1 cây hoa trắng"
            ],
            correct: 0,
            explanation: `<b>Hướng dẫn giải:</b><br>
            - Phép lai P: Aa (đỏ) x aa (trắng) -> F1: 1/2 Aa : 1/2 aa.<br>
            - F1 giao phấn được F2 có tỉ lệ kiểu gen là: 1/16 AA : 6/16 Aa : 9/16 aa.<br>
            - Khi F2 tự thụ phấn:<br>
            + 1/16(AA x AA) = 1/16 AA<br>
            + 6/16(Aa x Aa) = 6/64 AA : 12/64 Aa : 6/64 aa<br>
            + 9/16(aa x aa) = 9/16 aa<br>
            => Tỉ lệ phân li kiểu gen: 10/64 AA : 12/64 Aa : 42/64 aa.<br>
            => Tỉ lệ kiểu hình F3: 22 Đỏ : 42 Trắng = <b>11 Đỏ : 21 Trắng</b>.`
        },
        {
            q: "<b>Bài 2:</b> Ở ruồi giấm, V (cánh dài) trội hoàn toàn v (cánh cụt). Cho ruồi cánh dài x cánh cụt -> F1: 1 dài : 1 cụt. Tiếp tục cho F1 giao phối được F2. <br><br><b>Hỏi:</b> Muốn xác định được kiểu gen của bất kỳ cá thể ruồi cánh dài nào ở F2 thì phải thực hiện phép lai gì?",
            options: [
                "Phép lai thuận nghịch",
                "Cho tự thụ phấn",
                "Phép lai phân tích",
                "Cho giao phối ngẫu nhiên"
            ],
            correct: 2,
            explanation: `<b>Hướng dẫn giải:</b><br>
            - Ruồi giấm là động vật giao phối, ở F2 ruồi cánh dài có thể mang kiểu gen VV hoặc Vv.<br>
            - Để xác định được kiểu gen của cá thể mang tính trạng trội (cánh dài) ở động vật, ta phải dùng <b>phép lai phân tích</b> (lai với cá thể mang kiểu hình lặn cánh cụt vv).<br>
            + Nếu Fa 100% cánh dài -> Kiểu gen VV.<br>
            + Nếu Fa 1 dài : 1 cụt -> Kiểu gen Vv.`
        },
        {
            q: "<b>Bài 3:</b> Đậu Hà Lan, P đỏ x đỏ -> F1 xuất hiện hoa trắng. Người ta lấy một số cây hoa đỏ F1 cho giao phối ngẫu nhiên, ở F2 thu được tỉ lệ 24 hoa đỏ : 1 cây hoa trắng. <br><br><b>Hỏi:</b> Tỉ lệ các cây hoa đỏ F1 có kiểu gen khác nhau được sử dụng là bao nhiêu?",
            options: [
                "1/3 AA : 2/3 Aa",
                "0,6 AA : 0,4 Aa",
                "0,5 AA : 0,5 Aa",
                "0,8 AA : 0,2 Aa"
            ],
            correct: 1,
            explanation: `<b>Hướng dẫn giải:</b><br>
            - F1 có hoa đỏ mang kiểu gen AA và Aa. Gọi tỉ lệ đem lai là x AA : y Aa (x + y = 1).<br>
            - Giao phối ngẫu nhiên tạo hạt phấn và noãn: a = y/2; A = x + y/2.<br>
            - F2 có hoa trắng (aa) = (y/2)² = 1/25 (vì tỉ lệ 24 đỏ : 1 trắng -> lặn chiếm 1/25).<br>
            - Giải phương trình: y/2 = 1/5 => y = 2/5 = 0,4.<br>
            => x = 1 - 0,4 = 0,6.<br>
            => Tỉ lệ các cây F1 mang lai là: <b>0,6 AA : 0,4 Aa</b> (hoặc 3 AA : 2 Aa).`
        },
        {
            q: "<b>Bài 4:</b> Một quần thể cây ăn quả ở thế hệ xuất phát (P) có 1/3 số cây có kiểu gen AA, 2/3 số cây có kiểu gen Aa. <br><br><b>Hỏi:</b> Hãy xác định tỷ lệ kiểu gen ở thế hệ tiếp theo nếu cho quần thể này giao phấn ngẫu nhiên?",
            options: [
                "3/6 AA : 1/6 Aa : 2/6 aa",
                "5/8 AA : 2/8 Aa : 1/8 aa",
                "1/4 AA : 2/4 Aa : 1/4 aa",
                "4/9 AA : 4/9 Aa : 1/9 aa"
            ],
            correct: 3,
            explanation: `<b>Hướng dẫn giải:</b><br>
            - Trường hợp giao phấn ngẫu nhiên:<br>
            - P: (1/3 AA : 2/3 Aa)  x  (1/3 AA : 2/3 Aa)<br>
            - Tỉ lệ giao tử (Gp): A = 1/3 + 2/3 : 2 = 2/3 ; a = 1/3.<br>
            - F1 (Sự kết hợp ngẫu nhiên của các giao tử):<br>
            (2/3 A : 1/3 a) x (2/3 A : 1/3 a) = <b>4/9 AA : 4/9 Aa : 1/9 aa</b>.`
        },
        {
            q: "<b>Bài 5:</b> Đem gieo các hạt đậu Hà Lan màu vàng (P) tự thụ phấn thu được F1: 17 hạt vàng : 3 hạt xanh. <br><br><b>Hỏi:</b> Nếu cho các cây F1 giao phối ngẫu nhiên với nhau thì tỉ lệ kiểu hình ở F2 là bao nhiêu?",
            options: [
                "91 hạt vàng : 9 hạt xanh",
                "15 hạt vàng : 1 hạt xanh",
                "3 hạt vàng : 1 hạt xanh",
                "9 hạt vàng : 7 hạt xanh"
            ],
            correct: 0,
            explanation: `<b>Hướng dẫn giải:</b><br>
            - Gọi tỉ lệ cây Aa ở P là x. Tự thụ phấn tạo aa ở F1 = 1/4.x = 3/20 => x = 3/5. Vậy P: 2/5 AA : 3/5 Aa.<br>
            - P tự thụ phấn tạo F1 có tỉ lệ kiểu gen: 11/20 AA : 6/20 Aa : 3/20 aa.<br>
            - Cho F1 giao phối ngẫu nhiên:<br>
            + Tần số alen F1: a = 3/20 + 6/40 = 3/10 ; A = 7/10.<br>
            + F2 thu được lặn aa = (3/10)² = 9/100 (9 hạt xanh).<br>
            + Vàng (A_) = 1 - 9/100 = 91/100.<br>
            => Tỉ lệ kiểu hình F2: <b>91 hạt vàng : 9 hạt xanh</b>.`
        }
    ];

    let timerInterval;
    let seconds = 0;
    let studentName = '';
    let studentClass = '';
    let userAnswers = new Array(questions.length).fill(null);

    // API Của Google Sheet
    const API_URL = "https://script.google.com/macros/s/AKfycbwebyo0Wkgkq_PbpD7QtxO7dIiFVa1n4gXkJ9ckfrNaIqylw7fTSbhSx_JzAO4sBnvN/exec";

    function startQuiz() {
        studentName = document.getElementById('studentName').value.trim();
        studentClass = document.getElementById('studentClass').value.trim();

        if (!studentName || !studentClass) {
            alert('Bạn nhớ nhập Tên và Lớp trước khi làm bài nhé! 🐹');
            return;
        }

        document.getElementById('intro-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        document.getElementById('displayInfo').innerText = `${studentName} - Lớp ${studentClass}`;

        renderQuestions();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${m}:${s}`;
        }, 1000);
    }

    function renderQuestions() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        
        questions.forEach((q, qIndex) => {
            let card = document.createElement('div');
            card.className = 'question-card';
            
            let title = document.createElement('div');
            title.className = 'question-text';
            title.innerHTML = `Câu ${qIndex + 1}: ${q.q}`;
            card.appendChild(title);

            let optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            optionsDiv.id = `options-${qIndex}`;

            q.options.forEach((opt, optIndex) => {
                let btn = document.createElement('div');
                btn.className = 'option';
                btn.innerHTML = String.fromCharCode(65 + optIndex) + ". " + opt; 
                btn.onclick = () => selectOption(qIndex, optIndex);
                optionsDiv.appendChild(btn);
            });

            card.appendChild(optionsDiv);
            
            // Khối giải thích ẩn
            let expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            expDiv.id = `exp-${qIndex}`;
            expDiv.innerHTML = q.explanation;
            card.appendChild(expDiv);

            container.appendChild(card);
        });
    }

    function selectOption(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        let options = document.getElementById(`options-${qIndex}`).children;
        for (let i = 0; i < options.length; i++) {
            options[i].classList.remove('selected');
        }
        options[optIndex].classList.add('selected');
    }

    function submitQuiz() {
        // Kiểm tra xem đã làm hết chưa
        if (userAnswers.includes(null)) {
            let confirmSubmit = confirm('Bạn chưa làm hết các câu hỏi. Bạn có chắc chắn muốn nộp bài không?');
            if (!confirmSubmit) return;
        }

        clearInterval(timerInterval);
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        let correctCount = 0;
        let chiTiet = "";

        // Chấm bài & Hiển thị kết quả trên form
        questions.forEach((q, i) => {
            let options = document.getElementById(`options-${i}`).children;
            let userAnswer = userAnswers[i];
            
            // Xóa sự kiện click
            for(let opt of options) { opt.onclick = null; opt.style.cursor = 'default'; }

            if (userAnswer === q.correct) {
                correctCount++;
                if (userAnswer !== null) options[userAnswer].classList.add('correct-ans');
                chiTiet += `Câu ${i+1}: Đúng | `;
            } else {
                if (userAnswer !== null) options[userAnswer].classList.add('wrong-ans');
                options[q.correct].classList.add('correct-ans'); // Hiện đáp án đúng
                chiTiet += `Câu ${i+1}: Sai | `;
            }
            
            // Hiện lời giải
            document.getElementById(`exp-${i}`).style.display = 'block';
        });

        let diemSo = (correctCount / questions.length) * 10;
        let timeTaken = document.getElementById('timeDisplay').innerText;

        // Chuẩn bị Data JSON gửi đi
        const payload = {
            Thoigian: timeTaken,
            Chude: "DẠNG 6: Tự thụ phấn & Giao phấn ngẫu nhiên",
            hoTen: studentName,
            lop: studentClass,
            diemSo: diemSo,
            chiTiet: chiTiet.slice(0, -3) // Xóa dấu | cuối cùng
        };

        // Fetch API Post
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors', // Sử dụng no-cors để tránh lỗi trình duyệt chặn
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(() => {
            showFinalResult(diemSo, timeTaken);
        }).catch((err) => {
            console.error('Lỗi khi gửi:', err);
            alert("Đã có lỗi nhỏ khi gửi điểm về máy chủ, nhưng điểm của bạn vẫn hiển thị bên dưới nhé!");
            showFinalResult(diemSo, timeTaken);
        });
    }

    function showFinalResult(diemSo, timeTaken) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        document.getElementById('scoreDisplay').innerText = diemSo.toFixed(1) + " / 10";
        document.getElementById('resultTime').innerText = timeTaken;
        
        // Di chuyển khung chứa bài làm sang trang kết quả để xem lại
        let quizContainer = document.getElementById('quiz-container');
        document.getElementById('review-container').appendChild(quizContainer);
    }
</script>

</body>
</html>
